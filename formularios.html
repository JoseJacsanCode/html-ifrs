<!DOCTYPE html>

    <title>Formulários</title>

<body>
    <form action="submit.php" method="post" autocomplete="off" novalidate>
        <p>Escolha sua bebida favorita: </p>

        <input type="radio" id="cevada" name="bebida" value="Cevada">
        <label for="cevada">Cevada</label>

        <label for="cha">Chá</label>

        <input type="radio" name="agua" id="agua" name="bebida" value="Água" checked>
        <label for="agua">Água</label>

        <input type="submit" value="Enviar">

    </form>
