<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, intial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <h1>Tabelas</h1>
    <table border="1" align="center">

        <caption>Nomes e Profissões</caption>
        <thead>
            <tr>
            <th>Nome</th>
            <th>Idade</th>
            <th colspan="2">Profissão</th>
        </tr>
        </thead>
        <tr>
            <td rowspan="2">Maria</td>
            <td>28</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>João</td>
            <td>32</td>
            <td>Desenvolvedor</td>
        </tr>
    </table> 
</body>

</html>
